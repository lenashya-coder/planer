<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --ink:#F5F5F3; --muted:#8A8A8E; --faint:#3A3A3E;
  --card:#EFEEEA; --card-ink:#1A1A1C; --card-muted:#8C8B87; --card-line:#DAD8D2;
  --blue:#4AAFE3; --blue2:#BFE4F6; --pink:#F49CC4; --pink2:#FBD3E6; --chip:#E3E2DD;
  --ok:#35D07F; --warn:#FFB020; --bad:#FF5A4E;
  --pill:#111113; --pill-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F4F2; --ink:#111113; --muted:#6F6F74; --faint:#D6D6D2;
    --card:#FFFFFF; --card-line:#E6E4DE; --chip:#EFEEEA;
  }
}
:root[data-theme="light"]{
  --bg:#F4F4F2; --ink:#111113; --muted:#6F6F74; --faint:#D6D6D2;
  --card:#FFFFFF; --card-line:#E6E4DE; --chip:#EFEEEA;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 70px}
.icon{width:15px;height:15px;flex:none;vertical-align:-2px}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.hello{font-size:15px;color:var(--muted)}
.clocks{display:flex;align-items:center;gap:18px}
.mclock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.mclock span{font-size:11px;color:var(--muted)}
.mclock b{font-size:clamp(17px,3.4vw,22px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mclock.pink b{color:var(--pink)}
.clock{display:flex;align-items:center;gap:12px;padding-left:18px;border-left:1px solid var(--faint)}
@media (max-width:520px){.top{align-items:flex-start}.hello{display:none}.clocks{width:100%;justify-content:space-between;gap:10px}}
.clock .tz{font-size:11px;line-height:1.2;color:var(--muted);text-align:right}
.clock .time{font-size:clamp(34px,7vw,52px);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* неделя */
.weeknav{display:flex;align-items:center;gap:6px;margin:4px 0 10px;color:var(--muted);font-size:13px}
.navbtn{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.navbtn:hover{background:var(--faint);color:var(--ink)}
.cal{background:var(--card);color:var(--card-ink);border-radius:22px;overflow:hidden}
.cal-scroll{overflow-x:auto;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cal-grid{display:grid;grid-template-columns:44px repeat(7,minmax(120px,1fr));min-width:900px;position:relative}
.cal-head{position:sticky;top:0;z-index:2;background:var(--card);padding:12px 10px 10px;border-bottom:1px solid var(--card-line);
  display:flex;justify-content:space-between;align-items:baseline;border-left:1px solid var(--card-line);cursor:pointer;min-height:58px}
.cal-head.corner{border-left:0;cursor:default;left:0;z-index:3}
.cal-head .wd{font-size:12px;color:var(--card-muted)}
.cal-head .dn{font-size:22px;font-weight:300;color:var(--card-muted);line-height:1}
.cal-head.today .dn,.cal-head.today .wd{color:var(--card-ink)}
.cal-head.today .dn{font-weight:500;color:var(--pink)}
.cal-head.sel{box-shadow:inset 0 -3px 0 var(--pink)}
.cal-head .badges{display:flex;gap:3px;margin-top:5px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;border-radius:6px;padding:1px 5px;background:var(--chip);color:var(--card-muted)}
.badge.last{background:var(--blue);color:#fff}
.cal-hour{position:sticky;left:0;z-index:1;background:var(--card);font-size:11px;color:var(--card-muted);padding:4px 6px 0;height:46px;border-top:1px solid var(--card-line)}
.cal-cell{border-left:1px solid var(--card-line);border-top:1px solid var(--card-line);height:46px;padding:3px 4px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-cell.selcol{background:rgba(244,156,196,.10)}
.chipc{display:flex;align-items:center;gap:4px;font-size:11.5px;background:var(--chip);border-radius:8px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;width:100%}
.chipc .t{color:var(--card-muted);font-variant-numeric:tabular-nums}
.chipc.imp{background:var(--blue);color:#fff}
.chipc.imp .t{color:rgba(255,255,255,.8)}
.chipc.done{opacity:.45;text-decoration:line-through}

/* сегодня */
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin:30px 0 14px}
.sec-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1,h2{margin:0;font-weight:500;letter-spacing:-.03em}
h1{font-size:clamp(34px,6vw,46px);line-height:1}
h2{font-size:clamp(26px,4.5vw,34px);line-height:1.05}
.sub{color:var(--muted);font-size:14px}
.stats{display:flex;align-items:center;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600;margin-left:5px}

.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
@media (max-width:700px){.cols{grid-auto-columns:82%}}
.colw{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--card);color:var(--card-ink);border-radius:22px;padding:16px 16px 14px;min-height:300px;display:flex;flex-direction:column}
/* дизайн — розовый, личное — ледяной голубой */
.card.design{background:linear-gradient(165deg,#FFF1F7 0%,#FBD6E7 55%,#F5B5D2 100%);color:#3A1426;--card-muted:#9A5D7A;--card-line:#F0C3D8}
.card.design .card-h{color:#3A1426}
.card.design .ck{border-color:#D8789F}
.card.design .task.done .ck{background:#E89AB9;border-color:#E89AB9}
.card.design .addbtn{color:#B4527D}
.card.life{background:linear-gradient(160deg,#F2F8FC 0%,#D9EAF6 50%,#B9D6EC 100%);color:#17334A;--card-muted:#5E819C;--card-line:#C6DCEC}
.card.life .card-h{color:#17334A}
.card.life .ck{border-color:#4FB3D6}
.card.life .task.done .ck{background:#4FB3D6;border-color:#4FB3D6}
.card.life .addbtn{color:#2E8FB3}
.card.life .card-h .icon{color:#3FB0D6}
.card.design .card-h .icon{color:#D8669A}
.chipc.design{background:#FBD3E6;color:#3A1426}
.chipc.life{background:#D6EAF7;color:#17334A}
.chipc.life .t{color:#4F7896} .chipc.design .t{color:#9A5D7A}
.card.imp{background:linear-gradient(180deg,var(--blue) 0%,#8FC3EE 45%,#E4A9D6 80%,var(--pink) 100%);color:#fff}
.card-h{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;margin-bottom:12px}
.card-h .n{margin-left:auto;font-size:12px;color:var(--card-muted);font-variant-numeric:tabular-nums}
.card.imp .card-h .n{color:rgba(255,255,255,.85)}
.card-h .x{border:0;background:transparent;color:var(--card-muted);padding:0 2px;font-size:18px;line-height:1}
.list{display:flex;flex-direction:column;gap:10px}
.task{display:flex;gap:9px;align-items:flex-start}
.ck{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid var(--card-muted);background:transparent;padding:0;display:grid;place-items:center}
.card.imp .ck{border-color:rgba(255,255,255,.9)}
.ck svg{opacity:0}
.task.done .ck{background:var(--card-muted);border-color:var(--card-muted)}
.card.imp .task.done .ck{background:rgba(255,255,255,.55);border-color:transparent}
.task.done .ck svg{opacity:1}
.tbody{flex:1;min-width:0}
.ttext{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.tmeta{font-size:11.5px;color:var(--card-muted);margin-top:2px;display:flex;gap:8px}
.card.imp .tmeta{color:rgba(255,255,255,.8)}
.task.done .ttext{color:var(--card-muted);text-decoration:line-through}
.card.imp .task.done .ttext{color:rgba(255,255,255,.75)}
.tdel{flex:none;border:0;background:transparent;color:var(--card-muted);font-size:17px;line-height:1;padding:0 2px;opacity:.6}
.subs{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.subt{display:flex;align-items:center;gap:7px;font-size:13px}
.subt .ck{width:16px;height:16px;margin:0}
.subt.done span{text-decoration:line-through;color:var(--card-muted)}
.subt .tdel{margin-left:auto;font-size:15px}
.inl{display:flex;gap:6px;margin-top:2px}
.inl input{flex:1;min-width:0;border:1px solid var(--card-line);background:rgba(255,255,255,.55);border-radius:10px;padding:6px 9px;font-size:13px;outline:none;color:var(--card-ink)}
.inl button{border:0;border-radius:10px;background:var(--pill);color:var(--pill-ink);padding:0 11px;font-size:13px}
.addbtn{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 0;margin:14px 0 4px;color:var(--card-muted);font-size:14px}
.card.imp .addbtn{color:#fff}
.addbtn .plus{width:20px;height:20px;border-radius:50%;border:1.3px solid currentColor;display:grid;place-items:center;font-size:14px;line-height:1}
.hint{font-size:12px;color:rgba(255,255,255,.85);margin:12px 0 4px}
.form{display:flex;flex-direction:column;gap:7px;margin:12px 0 4px}
.form input[type=text]{border:1px solid var(--card-line);background:rgba(255,255,255,.7);border-radius:12px;padding:8px 10px;outline:none;color:var(--card-ink);font-size:14px}
.form .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.form input[type=date],.form input[type=time]{border:1px solid var(--card-line);background:rgba(255,255,255,.7);border-radius:10px;padding:5px 8px;color:var(--card-ink);font-size:13px}
.form label{font-size:12px;display:flex;gap:5px;align-items:center}
.form .go{margin-left:auto;border:0;border-radius:10px;background:var(--pill);color:var(--pill-ink);padding:6px 12px;font-size:13px}
.form .cancel{border:0;background:transparent;font-size:13px;color:inherit;opacity:.7}
.donehead{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.06em;color:var(--card-muted);margin:14px 0 10px}
.donehead::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.card.imp .donehead{color:rgba(255,255,255,.85)}

/* трекер публикаций */
.track{border-radius:16px;padding:10px 12px;border:1px solid var(--faint);font-size:13px;display:flex;flex-direction:column;gap:6px}
.track.stale{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.trow{display:flex;align-items:center;gap:8px}
.trow .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.trow .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.trow .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.trow .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.trow .lbl{color:var(--muted)}
.trow .vwrap{margin-left:auto;position:relative;display:inline-flex}
.trow .val{font-weight:600;border:0;background:transparent;padding:0;text-decoration:underline dotted;text-underline-offset:3px}
.dpick{position:absolute;right:0;top:100%;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.trow .val.ok{color:var(--ok)} .trow .val.warn{color:var(--warn)} .trow .val.bad{color:var(--bad)}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.obtn{border:1px solid var(--faint);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px}
.obtn:hover{border-color:var(--muted)}
.undo{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.newcol{border:1px dashed var(--pink);background:transparent;border-radius:999px;padding:6px 14px;color:var(--pink);font-size:13px}

/* прогресс */
.prog{background:var(--card);color:var(--card-ink);border-radius:22px;padding:16px 18px;margin-top:22px}
.prog-top{display:flex;justify-content:space-between;font-size:12px;color:var(--card-muted);margin-bottom:10px}
.ticks{display:grid;grid-template-columns:repeat(48,1fr);gap:3px;height:18px}
.ticks i{border-radius:2px;background:var(--card-ink)}
.ticks i.on{background:var(--c,var(--blue))}
@media (max-width:600px){.ticks{grid-template-columns:repeat(24,1fr)}.ticks i:nth-child(n+25){display:none}}
.prog-num{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.prog-num b{font-size:30px;font-weight:500;letter-spacing:-.03em}
.prog-num span{font-size:13px;color:var(--card-muted)}

/* инсайты */
.ins{background:var(--card);color:var(--card-ink);border-radius:22px;padding:14px 16px}
.ins textarea{width:100%;min-height:120px;border:0;background:transparent;resize:vertical;outline:none;font-size:15px;color:var(--card-ink)}
.ins textarea::placeholder{color:var(--card-muted)}
.ins-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.ins-bar .auto{font-size:12px;color:var(--card-muted);width:100%}
.pbtn{border:0;border-radius:999px;background:var(--pill);color:var(--pill-ink);padding:8px 14px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pbtn.ghost{background:transparent;color:var(--card-ink);border:1px solid var(--card-line)}
.pbtn:disabled{opacity:.5;cursor:default}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.note{background:var(--card);color:var(--card-ink);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note .k{font-size:11px;color:var(--card-muted);display:flex;justify-content:space-between;gap:8px}
.note .body{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.note.open .body{-webkit-line-clamp:unset;display:block}
.note .acts{display:flex;gap:12px;margin-top:auto}
.note .acts button{border:0;background:transparent;padding:0;font-size:12px;color:var(--card-muted);text-decoration:underline}
.payform .pf-grid{display:grid;grid-template-columns:1.3fr .8fr;gap:8px}
.payform .pf-grid .wide{grid-column:1/-1}
.payform input,.payform select{border:1px solid var(--card-line);background:rgba(255,255,255,.6);border-radius:12px;padding:9px 11px;color:var(--card-ink);font-size:14px;outline:none;min-width:0;width:100%}
.payform .ins-bar{justify-content:flex-end}
.pfilter{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.pfilter button{border:1px solid var(--faint);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.pfilter button[aria-selected="true"]{background:var(--pink);color:#2a0c1a;border-color:var(--pink)}
.plist{display:flex;flex-direction:column;gap:8px}
.pc{background:var(--card);color:var(--card-ink);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;border-left:5px solid var(--bad)}
.pc.paid{border-left-color:var(--ok)}
.pc .nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.pc .sm{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pc .wk{grid-column:1/-1;font-size:13.5px;color:var(--card-muted);overflow-wrap:anywhere}
.pc .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stbtn{border:0;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;background:var(--bad);color:#fff}
.pc.paid .stbtn{background:var(--ok);color:#06220f}
.pc select{border:1px solid var(--card-line);background:transparent;border-radius:999px;padding:4px 8px;font-size:12.5px;color:var(--card-ink)}
.pc select.todo{border-color:var(--warn);background:rgba(255,176,32,.14)}
.pc .mini{margin-left:auto;display:flex;gap:10px}
.pc .mini button{border:0;background:transparent;padding:0;font-size:12px;color:var(--card-muted);text-decoration:underline}
.est{grid-column:1/-1;border-top:1px solid var(--card-line);padding-top:8px;margin-top:2px}
.est-tg{border:0;background:transparent;padding:0;font-size:13px;font-weight:600;color:var(--card-ink);display:flex;gap:8px;align-items:center}
.est-tg .ar{display:inline-block;transition:transform .15s;color:var(--card-muted)}
.est-tg[aria-expanded="true"] .ar{transform:rotate(90deg)}
.est-tg .cnt{font-weight:400;color:var(--card-muted)}
.est-body{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.est-head,.est-row{display:grid;grid-template-columns:minmax(0,1fr) 140px 64px 104px 104px 24px;gap:6px;align-items:center}
.est-head{font-size:11px;color:var(--card-muted);padding:0 2px}
.est-head span:nth-child(n+3){text-align:right}
.est-row input[type=date]{padding:5px 6px;font-size:13px}
.est-row input{width:100%;min-width:0;border:1px solid var(--card-line);background:rgba(255,255,255,.6);border-radius:9px;padding:6px 8px;font-size:13.5px;color:var(--card-ink);outline:none}
.est-row input.num{text-align:right;font-variant-numeric:tabular-nums}
.est-row .lt{text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.est-row .tdel{font-size:17px}
.est-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:4px}
.est-add{border:1px dashed var(--pink);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--card-ink)}
.est-foot .mini2{border:0;background:transparent;padding:0;font-size:12px;color:var(--card-muted);text-decoration:underline}
.est-total{margin-left:auto;font-size:14px}
.est-total b{font-size:16px;font-variant-numeric:tabular-nums}
.est-empty{font-size:12.5px;color:var(--card-muted)}
.pc .sm small{display:block;font-size:11px;font-weight:400;color:var(--card-muted)}
@media (max-width:560px){
  .est-head{display:none}
  .est-row{grid-template-columns:1fr 1fr 1fr 24px;row-gap:5px;padding-bottom:8px;border-bottom:1px dashed var(--card-line)}
  .est-row .nmi{grid-column:1/-1}
  .est-row .dti{grid-column:span 2}
  .est-row .qti{grid-column:span 2}
  .est-row .pri{grid-column:span 2}
  .est-row .lt{align-self:center}
}
.sumt{background:var(--card);color:var(--card-ink);border-radius:22px;padding:8px 10px;overflow-x:auto}
.srow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(150px,1.4fr) 176px 132px 222px minmax(110px,1fr) minmax(150px,1.4fr) 26px;gap:6px;align-items:center;padding:6px 4px 6px 10px;border-left:4px solid transparent;border-radius:10px;min-width:1100px}
.srow+.srow{border-top:1px solid var(--card-line)}
.srow.shead{font-size:11px;color:var(--card-muted);padding-top:4px;padding-bottom:4px}
.srow.warn{border-left-color:var(--warn)} .srow.bad{border-left-color:var(--bad)}
.srow.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:rgba(244,156,196,.35)}100%{background:transparent}}
.scell{display:flex;gap:4px;align-items:center;min-width:0}
.scell .cl{display:none}
.scell .two{display:flex;gap:4px;width:100%;align-items:center}
.srow textarea.grow{resize:none;overflow:hidden;line-height:1.35;font-family:inherit;display:block;min-height:31px;white-space:pre-wrap;overflow-wrap:anywhere}
.srow{align-items:start}
.srow input,.srow select,.srow textarea{width:100%;min-width:0;border:1px solid var(--card-line);background:rgba(255,255,255,.6);border-radius:9px;padding:6px 7px;font-size:13px;color:var(--card-ink);outline:none}
.srow input[type=time]{width:92px;flex:none}
.srow select.pst{font-weight:600}
.pst.none{background:transparent;border-style:dashed;color:var(--card-muted)} .pst.start{background:rgba(0,0,0,.04)} .pst.dev{background:rgba(74,175,227,.2);border-color:var(--blue)}
.pst.rev{background:rgba(244,156,196,.25);border-color:var(--pink)} .pst.fix{background:rgba(255,90,78,.15);border-color:var(--bad)}
.pst.save{background:rgba(255,176,32,.18);border-color:var(--warn)} .pst.print{background:rgba(160,120,230,.18);border-color:#A078E6}
.pst.send{background:rgba(53,208,127,.2);border-color:var(--ok)}
.pst.done{background:var(--ok);border-color:var(--ok);color:#06220f}
.srow.isdone{opacity:.55}
.srow.isdone textarea{text-decoration:line-through}
.slink{flex:none;align-self:center;border:0;background:transparent;color:var(--blue);font-size:15px;padding:0 2px;text-decoration:none}
.sempty{padding:14px 10px;color:var(--card-muted);font-size:14px}
.dl{font-size:11px;color:var(--card-muted);white-space:nowrap}
.dl.warn{color:#B77900} .dl.bad{color:var(--bad);font-weight:600}
.badge.ddl{background:var(--pink);color:#2a0c1a;font-weight:600}
.pmini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px}
.pmini select{border:1px solid var(--card-line);border-radius:999px;padding:4px 8px;font-size:12px;color:var(--card-ink)}
@media (max-width:760px){
  .sumt{padding:6px;background:transparent;overflow:visible}
  .srow.shead{display:none}
  .srow{min-width:0;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:10px 10px 10px 12px;row-gap:8px;margin-bottom:8px;border-top:0!important}
  .scell{flex-direction:column;align-items:stretch;gap:2px}
  .scell .cl{display:block;font-size:11px;color:var(--card-muted)}
  .scell .two{display:flex;gap:4px}
  .scell.wide{grid-column:1/-1}
  .srow .tdel{position:absolute;right:8px;top:6px}
  .srow{position:relative}
}
.pempty{color:var(--muted);font-size:14px;padding:4px 2px}
@media (max-width:520px){.payform .pf-grid{grid-template-columns:1fr 1fr}.payform .pf-grid #pfName,.payform .pf-grid #pfSum{grid-column:auto}}
.syncb{background:var(--card);color:var(--card-ink);border-radius:18px;padding:14px 16px;margin-bottom:18px;border:2px solid var(--warn)}
.syncb .sb-text{font-size:14px;margin-bottom:10px}
.syncb .sb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.syncb .sb-inp{flex:1;min-width:200px;border:1px solid var(--card-line);border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.6);color:var(--card-ink);font-size:14px}
.chipc,.task[data-drag]{touch-action:pan-y}
.dragging-src{opacity:.35}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;background:linear-gradient(90deg,var(--blue),var(--pink));color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translate(-50%,-120%)}
.drop-on{outline:2px dashed var(--pink);outline-offset:-2px;background:rgba(74,175,227,.18)!important}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.dragh{flex:none;align-self:center;color:var(--card-muted);cursor:grab;font-size:15px;line-height:1;padding:2px;opacity:.55;letter-spacing:-2px}
.card.imp .dragh{color:rgba(255,255,255,.85)}
.mv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px}
.mv input{border:1px solid var(--card-line);background:rgba(255,255,255,.6);border-radius:10px;padding:4px 7px;color:var(--card-ink);font-size:12.5px}
.mv .chipbtn{border:1px solid var(--card-line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:1001;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{border:0;background:transparent;color:var(--pink);font-weight:600;padding:0}

<body>
<div class="wrap">
  <div class="syncb" id="syncBanner" hidden></div>
  <header class="top">
    <div class="hello" id="hello"></div>
    <div class="clocks"><div class="mclock"><span>Москва</span><b id="cMsk">--:--</b></div><div class="mclock pink"><span>Самара</span><b id="cSam">--:--</b></div><div class="clock"><div class="tz">Новосибирск<br>UTC+7</div><div class="time" id="clock">--:--</div></div></div>

    <div class="stats"><span>Ждём<b id="payWait">0 ₽</b></span><span id="payGotL">Получено<b id="payGot">0 ₽</b></span></div></div>
  <section class="ins payform" aria-label="Новый клиент">
    <div class="pf-grid">
      <input type="text" id="pfName" placeholder="Клиент" maxlength="80" aria-label="Клиент">
      <input type="text" id="pfSum" placeholder="Сумма, ₽ (или по смете)" inputmode="decimal" maxlength="14" aria-label="Сумма">
      <select id="pfInv" aria-label="Счёт"></select>

    </div>
    <div class="ins-bar"><button class="pbtn ghost" id="pfCancel" type="button" hidden>Отмена</button><button class="pbtn" id="pfAdd" type="button">Добавить клиента</button></div>
  </section>

  <div class="foot" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
    <button class="undo" id="copyLink" type="button">Скопировать мою ссылку</button>
    <button class="undo" id="exp" type="button">Скачать резервную копию</button>
    <button class="undo" id="imp" type="button">Загрузить копию</button>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
  </div>
</div>

<script>
(function(){
"use strict";
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const WDS=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mk=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const btn=(cls,text,fn,label)=>{const b=mk("button",cls,text);b.type="button";if(label)b.setAttribute("aria-label",label);if(fn)b.addEventListener("click",fn);return b};
const CHECK='<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICONS={
  tg:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 4.2 2.9 11.3c-1.3.5-1.2 1.3-.2 1.6l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.3-.5-1.8-1.4-1.2zM8.3 14l9.6-6.1c.5-.3.9-.1.5.2l-8 7.3-.3 3.4L8.3 14z"/></svg>',
  ig:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  design:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg>',
  life:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg>',
  imp:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>',
  pin:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.6 19.3c-.1-.8-.2-2 0-2.9l1.2-5s-.3-.6-.3-1.5c0-1.4.8-2.4 1.8-2.4.8 0 1.2.6 1.2 1.4 0 .8-.5 2.1-.8 3.2-.2 1 .5 1.8 1.5 1.8 1.8 0 3.2-1.9 3.2-4.7 0-2.5-1.8-4.2-4.3-4.2-2.9 0-4.6 2.2-4.6 4.4 0 .9.3 1.8.8 2.3l.1.4-.3 1.1c0 .2-.2.3-.4.2-1.3-.6-2.1-2.5-2.1-4 0-3.3 2.4-6.3 6.9-6.3 3.6 0 6.4 2.6 6.4 6 0 3.6-2.3 6.5-5.4 6.5-1.1 0-2.1-.6-2.4-1.2l-.7 2.5c-.2.9-.9 2.1-1.3 2.8A10 10 0 1 0 12 2z"/></svg>',
  dot:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>'
};

/* ---------- состояние ---------- */
const DEFAULT_COLS=[{id:"imp",name:"Задачи на сегодня",icon:"imp"},{id:"other",name:"Дизайн",icon:"design"},{id:"life",name:"Личное",icon:"life"},{id:"tg",name:"Telegram",icon:"tg"},{id:"ig",name:"Instagram",icon:"ig"},{id:"pin",name:"Pinterest",icon:"pin"}];
function blank(){return{v:2,cols:DEFAULT_COLS.map(c=>({...c})),tasks:[],posts:{tg:[],ig:[],igs:[],pin:[]},notes:[],drafts:{proj:"",post:""},clients:[],projects:[]}}
function norm(s){
  const b=blank(); if(!s||typeof s!=="object")return b;
  if(Array.isArray(s.cols)&&s.cols.length)b.cols=s.cols;
  if(Array.isArray(s.tasks))b.tasks=s.tasks.map(t=>({id:t.id||uid(),col:t.col||"other",text:String(t.text||""),date:t.date||key(today()),time:t.time||"",
    done:!!t.done,repeat:!!t.repeat,doneOn:t.doneOn||{},subs:Array.isArray(t.subs)?t.subs:[]}));
  if(s.posts)for(const k of ["tg","ig","igs","pin"])b.posts[k]=Array.isArray(s.posts[k])?s.posts[k]:[];
  if(Array.isArray(s.notes))b.notes=s.notes;
  if(s.drafts&&typeof s.drafts==="object")b.drafts={proj:s.drafts.proj||"",post:s.drafts.post||""};
  else if(typeof s.draft==="string")b.drafts.post=s.draft;
  if(Array.isArray(s.clients))b.clients=s.clients;
  if(Array.isArray(s.projects))b.projects=s.projects.filter(p=>p&&p.id);
  b.m3=!!s.m3;
  if(!b.m3){ // колонки «Дизайн» (бывшее «Другое») и «Личное» сразу после задач на сегодня
    const o=b.cols.find(x=>x.id==="other")||{id:"other",name:"Дизайн",icon:"design"};
    if(o.name==="Другое")o.name="Дизайн";o.icon="design";
    const l=b.cols.find(x=>x.id==="life")||{id:"life",name:"Личное",icon:"life"};
    b.cols=b.cols.filter(x=>x.id!=="other"&&x.id!=="life");
    const i=b.cols.findIndex(x=>x.id==="imp");b.cols.splice(i<0?0:i+1,0,o,l);
    b.m3=true;b.__mig=true;
  }
  b.m2=!!s.m2;
  if(!b.m2){const c=b.cols.find(x=>x.id==="imp");if(c&&c.name==="Самое важное")c.name="Задачи на сегодня";b.m2=true;b.__mig=true}
  b.updatedAt=+s.updatedAt||0;
  b.m1=!!s.m1;
  if(!b.m1){ // разовая настройка: даты последних публикаций и колонка Pinterest
    const at=(y,m,d)=>new Date(y,m-1,d,12).getTime();
    if(!b.posts.tg.length)b.posts.tg=[at(2026,7,20)];
    if(!b.posts.ig.length)b.posts.ig=[at(2026,7,20)];
    if(!b.posts.pin.length)b.posts.pin=[at(2026,9,4)];
    if(!b.cols.some(c=>c.id==="pin")){const i=b.cols.findIndex(c=>c.id==="ig");b.cols.splice(i<0?b.cols.length:i+1,0,{id:"pin",name:"Pinterest",icon:"pin"})}
    b.m1=true;b.__mig=true;
  }
  return b;
}
const LS={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SEED=null;
let S=norm(LS.get("planner:v2")||SEED);
if(!LS.get("planner:v2"))LS.set("planner:v2",S);

function migrate(){ // перенос из первой версии «Мой день»
  try{
    const r=LS.get("myday:routine");
    if(r&&Array.isArray(r.items))r.items.forEach(x=>S.tasks.push({id:x.id,col:"other",text:x.text,date:x.from||key(today()),time:"",done:false,repeat:true,doneOn:{},subs:(x.subs||[]).map(s=>({id:s.id,text:s.text,done:false}))}));
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i); const m=k&&k.match(/^myday:d-(\d{4}-\d\d-\d\d)$/); if(!m)continue;
      const d=LS.get(k); if(d&&Array.isArray(d.tasks))d.tasks.forEach(t=>S.tasks.push({id:t.id||uid(),col:"other",text:t.text,date:m[1],time:"",done:!!t.done,repeat:false,doneOn:{},subs:t.subs||[]}));
    }
  }catch(e){}
}

let db=null,base=null,dirtyAt=0,saveT=null;
const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]);
function prune(){ // держим документ компактным: старые выполненные задачи > 90 дней
  const lim=key(addDays(today(),-90));
  S.tasks=S.tasks.filter(t=>t.repeat||!t.done||t.date>=lim);
  for(const k of ["tg","ig","igs","pin"])S.posts[k]=S.posts[k].slice(-40);
  S.tasks.forEach(t=>{if(t.repeat)for(const d in t.doneOn)if(d.slice(0,10)<lim)delete t.doneOn[d]});
}

/* ---------- облако: Firebase Firestore по личному ключу ---------- */
const FB={apiKey:"AIzaSyBEgcnOX3UKem7JOY35ijlhTU8zg2WHKGQ",project:"planer-4edf4"};
let vaultKey=null,cloudReady=false,pushing=false,pendingPush=false,lastSync=0;
const docUrl=()=>"https://firestore.googleapis.com/v1/projects/"+FB.project+"/databases/(default)/documents/vaults/"+vaultKey+"?key="+FB.apiKey;
function status(txt){$("foot").textContent=txt}
function synced(){const d=new Date();lastSync=Date.now();status("Синхронизировано · "+pad(d.getHours())+":"+pad(d.getMinutes()))}
async function cloudGet(){
  const r=await timeout(fetch(docUrl(),{cache:"no-store"}),10000);
  if(r.status===404)return null;
  if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json();const raw=j.fields&&j.fields.data&&j.fields.data.stringValue;
  return raw?JSON.parse(raw):null;
}
async function cloudPut(){
  if(!cloudReady)return;
  if(pushing){pendingPush=true;return}
  pushing=true;pendingPush=false;
  try{
    prune();
    const body={fields:{data:{stringValue:JSON.stringify(S)},updatedAt:{integerValue:String(S.updatedAt||Date.now())}}};
    const r=await timeout(fetch(docUrl(),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),10000);
    if(!r.ok)throw new Error("http "+r.status);
    synced();
  }catch(e){status("Нет связи — изменения сохранены на устройстве и отправятся позже");pendingPush=true;pushing=false;return}
  pushing=false;if(pendingPush)cloudPut();
}
function save(){
  dirtyAt=Date.now();S.updatedAt=Date.now();LS.set("planner:v2",S);
  clearTimeout(saveT);saveT=setTimeout(cloudPut,700);
}
async function pull(){
  if(!cloudReady||pushing||Date.now()-dirtyAt<3000)return;
  try{
    const c=await cloudGet();
    if(!c){cloudPut();return}
    if((c.updatedAt||0)>(S.updatedAt||0)&&Date.now()-dirtyAt>=3000){S=norm(c);LS.set("planner:v2",S);afterLoad();render()}
    else if((c.updatedAt||0)<(S.updatedAt||0)){cloudPut();return}
    synced();
  }catch(e){status("Нет связи — работаю с данными на устройстве")}
}
function readKey(){
  const m=(location.hash||"").match(/k=([A-Za-z0-9]{32,})/);
  if(m){try{localStorage.setItem("planner:key",m[1])}catch(e){}return m[1]}
  try{return localStorage.getItem("planner:key")}catch(e){return null}
}
function myLink(){return location.origin+location.pathname+"#k="+vaultKey}
function banner(html,buttons){
  const b=$("syncBanner");b.hidden=false;b.textContent="";
  const p=mk("div","sb-text");p.innerHTML=html;b.append(p);
  const row=mk("div","sb-row");buttons.forEach(x=>row.append(x));b.append(row);
}
function hideBanner(){$("syncBanner").hidden=true}
async function connect(k){
  vaultKey=k;
  try{history.replaceState(null,"",location.pathname+location.search+"#k="+k)}catch(e){}
  status("Подключаюсь к облаку…");
  const flag="planner:synced:"+k;
  let c;
  try{c=await cloudGet()}catch(e){status("Нет связи — работаю с данными на устройстве");setTimeout(()=>connect(k),20000);return}
  let first=false;try{first=!localStorage.getItem(flag)}catch(e){}
  const done=()=>{try{localStorage.setItem(flag,"1")}catch(e){}cloudReady=true;hideBanner()};
  if(!c){done();save();return}                       // облако пустое — отправляем то, что есть
  const localHas=S.tasks.length||S.notes.length||(S.clients||[]).length;
  if(first&&localHas&&JSON.stringify(norm(c).tasks)!==JSON.stringify(S.tasks)){
    banner("<b>На этом устройстве и в облаке разные данные.</b> Что оставить?",[

function ago(ts){

  const txt=days<=0?"сегодня":days===1?"вчера":days+" "+plural(days,"день","дня","дней")+" назад";
  return{txt,cls:days<=1?"ok":days<=3?"warn":"bad",days};
}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}

let toastT;
function toast(msg,undo){

function moveTask(t,toDate,hour){
  const prev={date:t.date,time:t.time};
  if(t.repeat){toast("Ежедневные задачи не переносятся");return}
  let time=t.time;
  if(hour!=null){const mm=t.time?t.time.slice(3,5):"00";time=pad(hour)+":"+mm}
  if(toDate===t.date&&time===t.time)return;
  t.date=toDate;t.time=time;save();render();
  toast("Перенесено на "+fmtDay(toDate)+(hour!=null?", "+time:""),()=>{t.date=prev.date;t.time=prev.time;save();render()});
}
const DRAG={on:false,t:null,src:null,ghost:null,over:null,sx:0,sy:0,timer:null,pointer:null,justDropped:0};
function makeDraggable(el,t,label){
  if(t.repeat)return;
  el.dataset.drag="1";
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    if(e.target.closest("input,textarea,select")||(el.classList.contains("task")&&e.target.closest(".ck,.tdel,.subs")))return;
    DRAG.t=t;DRAG.src=el;DRAG.sx=e.clientX;DRAG.sy=e.clientY;DRAG.pointer=e.pointerType;DRAG.label=label;
    clearTimeout(DRAG.timer);
    if(e.pointerType!=="mouse")DRAG.timer=setTimeout(()=>startDrag(e.clientX,e.clientY),380); // долгое нажатие на телефоне
  });
}
function startDrag(x,y){
  if(!DRAG.t||DRAG.on)return;DRAG.on=true;
  DRAG.src.classList.add("dragging-src");document.body.classList.add("is-dragging");
  DRAG.ghost=mk("div","drag-ghost",DRAG.label);document.body.append(DRAG.ghost);moveGhost(x,y);
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
}
function moveGhost(x,y){
  DRAG.ghost.style.left=x+"px";DRAG.ghost.style.top=y+"px";
  const el=document.elementFromPoint(x,y);const tgt=el&&el.closest("[data-drop]");
  if(DRAG.over&&DRAG.over!==tgt)DRAG.over.classList.remove("drop-on");
  DRAG.over=tgt;if(tgt)tgt.classList.add("drop-on");
  if(y<70)window.scrollBy(0,-18);else if(y>window.innerHeight-50)window.scrollBy(0,18); // прокрутка страницы у краёв
  const sc=$("calScroll"),r=sc.getBoundingClientRect(); // автопрокрутка календаря у краёв
  if(y>r.top&&y<r.bottom){if(x<r.left+50)sc.scrollLeft-=12;else if(x>r.right-50)sc.scrollLeft+=12;
    if(y<r.top+70)sc.scrollTop-=10;else if(y>r.bottom-30)sc.scrollTop+=10}
}
function endDrag(drop){
  clearTimeout(DRAG.timer);
  if(DRAG.on){
    const tgt=DRAG.over,t=DRAG.t;
    DRAG.ghost&&DRAG.ghost.remove();DRAG.src&&DRAG.src.classList.remove("dragging-src");document.body.classList.remove("is-dragging");
    if(tgt)tgt.classList.remove("drop-on");
    DRAG.justDropped=Date.now();
    if(drop&&tgt&&t){const h=tgt.dataset.hour;moveTask(t,tgt.dataset.drop,h!=null&&h!==""?+h:null)}
  }
  Object.assign(DRAG,{on:false,t:null,src:null,ghost:null,over:null});
}
document.addEventListener("pointermove",e=>{
  if(!DRAG.t)return;
  if(!DRAG.on){
    const dist=Math.hypot(e.clientX-DRAG.sx,e.clientY-DRAG.sy);
    if(DRAG.pointer==="mouse"){if(dist>6)startDrag(e.clientX,e.clientY)}
    else if(dist>10){clearTimeout(DRAG.timer);DRAG.t=null} // палец поехал — это прокрутка
    return;
  }
  e.preventDefault();moveGhost(e.clientX,e.clientY);
});
document.addEventListener("pointerup",()=>endDrag(true));
document.addEventListener("pointercancel",()=>endDrag(false));
document.addEventListener("touchmove",e=>{if(DRAG.on)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(DRAG.t)e.preventDefault()});
document.addEventListener("click",e=>{if(Date.now()-DRAG.justDropped<400){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&DRAG.on)endDrag(false)});

function contactHref(v){
  v=(v||"").trim();if(!v)return null;
  if(/^https?:\/\//i.test(v))return v;

  if(/^@[A-Za-z0-9_]{3,}$/.test(v))return "https://t.me/"+v.slice(1);

}

/* ---------- часы, навигация ---------- */
const tzTime=(tz)=>{try{return new Intl.DateTimeFormat("ru-RU",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date())}catch(e){return "--:--"}};
function tick(){
  const nsk=tzTime("Asia/Novosibirsk");$("clock").textContent=nsk;
  $("cMsk").textContent=tzTime("Europe/Moscow");$("cSam").textContent=tzTime("Europe/Samara");
  const h=+nsk.slice(0,2);$("hello").textContent=h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер";
  if(key(today())!==lastDay){lastDay=key(today());render()}
}
let lastDay=key(today());
$("newCol").addEventListener("click",()=>{const n=prompt("Название колонки (например, «Курсы»)");if(n&&n.trim()){S.cols.push({id:"c"+uid(),name:n.trim().slice(0,40),icon:"dot"});save();render()}});
$("prevW").addEventListener("click",()=>{weekStart=addDays(weekStart,-7);sel=weekStart;render()});
$("nextW").addEventListener("click",()=>{weekStart=addDays(weekStart,7);sel=weekStart;render()});
const _render=render;render=function(){if(key(monday(sel))!==key(weekStart))weekStart=monday(sel);_render()};
window.addEventListener("resize",()=>renderProg());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});

$("copyLink").addEventListener("click",e=>{if(!vaultKey){askKey();window.scrollTo({top:0,behavior:"smooth"});return}
  const l=myLink();const ok=()=>{e.target.textContent="Ссылка скопирована";setTimeout(()=>e.target.textContent="Скопировать мою ссылку",2000)};
  try{navigator.clipboard.writeText(l).then(ok,()=>prompt("Скопируйте ссылку:",l))}catch(x){prompt("Скопируйте ссылку:",l)}});
$("exp").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="planer-"+key(today())+".json";document.body.append(a);a.click();a.remove()});
$("imp").addEventListener("click",()=>$("impFile").click());
$("impFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||!Array.isArray(v.tasks))throw 0;if(confirm("Заменить текущие задачи данными из копии?")){S=norm(v);save();render()}}catch(x){alert("Этот файл не похож на копию планера.")}e.target.value=""};r.readAsText(f)});
afterLoad();render();scrollCalToNow();tick();setInterval(tick,10000);

/* ---------- запуск синхронизации ---------- */
{const k=readKey();if(k)connect(k);else askKey()}
setInterval(()=>{if(!document.hidden)pull()},30000);
window.addEventListener("online",()=>{if(cloudReady)cloudPut();else if(vaultKey)connect(vaultKey)});
})();
</script>
</body>
</html>
